services:
  # Backend Service
  - type: web
    name: zerodha-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node index.js
    envVars:
      - key: PORT
        value: 3002
      - key: MONGO_URL
        fromDatabase:
          name: zerodha-mongodb
          property: connectionString
      - key: NODE_ENV
        value: production

  # Frontend Service
  - type: web
    name: zerodha-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npx serve -s build -l 3000
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: zerodha-backend
          property: url
      - key: REACT_APP_DASHBOARD_URL
        fromService:
          type: web
          name: zerodha-dashboard
          property: url

  # Dashboard Service
  - type: web
    name: zerodha-dashboard
    env: node
    region: oregon
    plan: free
    buildCommand: cd dashboard && npm install && npm run build
    startCommand: cd dashboard && npx serve -s build -l 3001
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: zerodha-backend
          property: url

databases:
  # MongoDB Database
  - name: zerodha-mongodb
    databaseName: zerodha
    user: zerodha_user
    region: oregon
    plan: free
